name: Sync to Infinity-X-Devices

on:
  push:
    branches:
      - mist

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"

      - name: Force Push to Target Repository
        run: |
          git config --unset-all http.https://github.com/.extraheader

          git remote add target https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/MistOS-Devices/device_xiaomi_haydn.git

          git push target mist:16.2 --force
